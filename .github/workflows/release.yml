name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  checks: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:

  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure Main Branch
        run: test "${GITHUB_REF_NAME}" = "main"

      - name: Determine Release Type
        id: type
        shell: bash
        run: |
          TYPE="${{ github.event.inputs.release_type }}"
          if [ -z "$TYPE" ]; then
            MSG=$(git log -1 --pretty=%B)
            if echo "$MSG" | grep -q "BREAKING CHANGE"; then
              TYPE="major"
            elif echo "$MSG" | grep -q "^feat"; then
              TYPE="minor"
            else
              TYPE="patch"
            fi
          fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT

      - name: Calculate Version
        id: version
        shell: bash
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | head -1)
          [ -z "$LAST_TAG" ] && LAST_TAG="v0.0.0"
          VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "${{ steps.type.outputs.type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *) PATCH=$((PATCH+1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

  detect-services:
    name: Detect Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Dynamic Matrix
        id: matrix
        shell: bash
        run: |
          SERVICES=$(find services -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          if [ -z "$SERVICES" ]; then
            echo "No services found"
            exit 1
          fi
          JSON=$(printf '%s\n' "$SERVICES" | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  build:
    name: Build Release (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - preflight
      - detect-services

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.matrix) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Dockerfile
        run: test -f services/${{ matrix.service }}/Dockerfile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Release Image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ needs.preflight.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Trivy Scan (release gate)
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ needs.preflight.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Sign Image (keyless, OIDC)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_DIGEST"

      - name: Generate SBOM for Image (Syft)
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft "${{ env.REGISTRY }}/${{ matrix.service }}:${{ needs.preflight.outputs.version }}" \
            -o cyclonedx-json > "${{ matrix.service }}-sbom.cdx.json"
          syft "${{ env.REGISTRY }}/${{ matrix.service }}:${{ needs.preflight.outputs.version }}" \
            -o spdx-json > "${{ matrix.service }}-sbom.spdx.json"

      - name: Attach SBOM to Image
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          cosign attach sbom \
            --sbom "${{ matrix.service }}-sbom.cdx.json" \
            "$IMAGE_DIGEST"

      - name: Record Image Digest for SLSA
        shell: bash
        run: |
          echo "${{ env.REGISTRY }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}" >> digests.txt

      - name: Upload SBOM + Digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            ${{ matrix.service }}-sbom.cdx.json
            ${{ matrix.service }}-sbom.spdx.json
            digests.txt
          retention-days: 90
          if-no-files-found: warn

  collect-digests:
    name: Collect Release Subjects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    outputs:
      subjects: ${{ steps.subjects.outputs.subjects }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Download Digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: artifacts
          merge-multiple: true

      - name: Build base64 Subjects
        id: subjects
        shell: bash
        run: |
          sort -u artifacts/digests.txt > subjects.txt
          SUBJECTS=$(base64 -w0 subjects.txt)
          echo "subjects=$SUBJECTS" >> $GITHUB_OUTPUT

  slsa:
    name: SLSA Provenance (generic)
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    needs: collect-digests
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.collect-digests.outputs.subjects }}
      upload-assets: false
      compile-generator: false

  tag-release:
    name: Tag + Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - preflight
      - build
      - slsa

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Release Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          find artifacts -maxdepth 1 -type f -name "*sbom*" -print0 | sort -z | \
            xargs -0 sha256sum > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag ${{ needs.preflight.outputs.tag }}
          git push origin ${{ needs.preflight.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Release ${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/SHA256SUMS
            artifacts/*.json
