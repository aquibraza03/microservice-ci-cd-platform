      summary: List authorized approval inbox
      responses: { "200": { description: Approval requests } }
  /organizations/{organizationId}/approvals/{approvalId}:
    parameters:
      - {
          name: organizationId,
          in: path,
          required: true,
          schema: { type: string },
        }
      - { name: approvalId, in: path, required: true, schema: { type: string } }
