      summary: Run read-only drift detection without reading secret plaintext
      parameters:
        - {
            name: organizationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: deploymentId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses: { "200": { description: Drift report } }
  /organizations/{organizationId}/audit/events:
    get:
      summary: Search tenant-scoped audit events
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200 },
          }
        - { name: action, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: resourceId, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { type: string } }
        - { name: requestId, in: query, schema: { type: string } }
        - { name: correlationId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        {
          "200": { description: Stable sequence-ordered audit page },
          "403": { $ref: "#/components/responses/Error" },
        }
  /organizations/{organizationId}/audit/integrity/verify:
    post:
      summary: Verify an audit-chain range
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      responses: { "200": { description: Integrity result and checkpoint } }
  /organizations/{organizationId}/audit/exports:
    post:
      summary: Request a bounded JSON Lines audit export
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string },
          }
      responses:
        {
          "202":
            { description: Export request state and one-time download grant },
        }
  /organizations/{organizationId}/audit/exports/{exportId}/download:
    get:
      summary: Download an audit export with a short-lived one-time grant
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - {
            name: exportId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: X-Audit-Download-Token,
            in: header,
            required: true,
            schema: { type: string },
          }
      responses:
        {
          "200": { description: audit-jsonl-v1 stream },
          "410": { $ref: "#/components/responses/Error" },
        }
  /organizations/{organizationId}/audit/retention:
    get:
      summary: Read audit retention metadata
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      responses: { "200": { description: Retention metadata } }
    put:
      summary: Change audit retention as an owner
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      responses: { "200": { description: Updated retention metadata } }
  /internal/metrics:
    get:
      summary: Internal Prometheus metrics scrape endpoint
      description: Requires an internal bearer metrics token and must not be publicly routed.
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string, pattern: "^Bearer " }
      responses:
        "200": { description: Prometheus text exposition }
        "404": { description: Hidden from unauthorized callers }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    OrganizationId:
      {
        in: path,
        name: organizationId,
        required: true,
        schema: { type: string },
      }
    ProjectId:
      { in: path, name: projectId, required: true, schema: { type: string } }
    InstallationId:
      {
        in: path,
        name: installationId,
        required: true,
        schema: { type: string },
      }
    DeploymentId:
      {
        in: path,
        name: deploymentId,
        required: true,
        schema: { type: string, format: uuid },
      }
  schemas:
    Role: { type: string, enum: [owner, admin, developer, operator, viewer] }
    DeploymentState:
      {
        type: string,
        enum:
          [
            queued,
            validating,
            testing,
            scanning,
            building,
            build_complete,
            pushing,
            deploying,
            verifying,
            ready,
            failed,
            cancel_requested,
            cancelled,
            rollback_queued,
            rolling_back,
            rolled_back,
          ],
      }
    DeploymentEvent:
      type: object
      required:
        [
          schemaVersion,
          sequence,
          deploymentId,
          stage,
          stateVersion,
          timestamp,
          level,
          source,
          attempt,
          eventType,
          safeMessage,
          metadata,
        ]
      properties:
        {
          schemaVersion: { type: string, enum: [deployment-event.v1] },
          sequence: { type: integer },
          deploymentId: { type: string },
          stage: { type: [string, "null"] },
          stateVersion: { type: [integer, "null"] },
          timestamp: { type: string, format: date-time },
          level: { type: string, enum: [debug, info, warn, error] },
          source: { type: string },
          attempt: { type: integer },
          eventType: { type: string },
          safeMessage: { type: string },
          metadata: { type: object, additionalProperties: true },
        }
    ImageMetadata:
      {
        type: object,
        required:
          [registry, repository, tags, digest, scanStatus, signatureStatus],
        properties:
          {
            registry: { type: string },
            repository: { type: string },
            tags: { type: array, items: { type: string } },
            digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" },
            scanStatus: { type: string },
            sbomReference: { type: string },
            provenanceReference: { type: string },
            signatureStatus: { type: string, enum: [verified, failed] },
          },
      }
    OrganizationInput:
      {
        type: object,
        required: [name, slug],
        properties:
          {
            name: { type: string },
            slug: { type: string },
            displayName: { type: string },
          },
      }
    ProjectInput:
      {
        type: object,
        required: [name, slug],
        properties:
          {
            name: { type: string },
            slug: { type: string },
            description: { type: string },
          },
      }
    MembershipInput:
      {
        type: object,
        required: [userId, role],
        properties:
          {
            userId: { type: string },
            role: { $ref: "#/components/schemas/Role" },
          },
      }
    Error:
      {
        type: object,
        required: [error],
        properties:
          {
            error:
              {
                type: object,
                required: [code, message, requestId],
                properties:
                  {
                    code: { type: string },
                    message: { type: string },
                    requestId: { type: string },
                  },
              },
          },
      }
  responses:
    Error:
      {
        description: Safe structured error,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
