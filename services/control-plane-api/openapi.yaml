          }
        - { name: targetId, in: query, schema: { type: string } }
      responses: { "200": { description: Policy catalogue } }
  /organizations/{organizationId}/policy-exceptions:
    parameters:
      [
        {
          name: organizationId,
          in: path,
          required: true,
          schema: { type: string },
        },
      ]
    get:
      summary: List scoped time-limited policy exceptions
      responses: { "200": { description: Exceptions } }
    post:
      summary: Request a policy exception
      responses: { "201": { description: Pending exception } }
  /organizations/{organizationId}/policy-exceptions/{exceptionId}/approve:
    post:
      summary: Approve an exact exception after version revalidation
      parameters:
        - {
            name: organizationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: exceptionId,
            in: path,
