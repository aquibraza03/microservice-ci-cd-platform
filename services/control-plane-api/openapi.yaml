        - {
            name: organizationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: approvalId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        {
          "200": { description: Approval decision },
          "409": { $ref: "#/components/responses/Error" },
        }
  /organizations/{organizationId}/approvals/{approvalId}/reject:
    post:
      summary: Reject a pending approval with a safe reason
