apiVersion: v1
kind: ServiceAccount
metadata: { name: otel-collector, namespace: platform-system }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: platform-system
  labels: { app.kubernetes.io/name: otel-collector }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: otel-collector } }
  template:
    metadata: { labels: { app.kubernetes.io/name: otel-collector } }
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.135.0@sha256:REPLACE_WITH_VERIFIED_DIGEST
          args: ["--config=/conf/collector.yaml"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 640Mi }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
            - { name: metrics, containerPort: 8888 }
          livenessProbe: { httpGet: { path: /, port: health }, initialDelaySeconds: 10 }
          readinessProbe: { httpGet: { path: /, port: health }, initialDelaySeconds: 5 }
          envFrom:
            - secretRef: { name: otel-backend-credentials }
          volumeMounts:
            - { name: config, mountPath: /conf, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
        - name: tls
          secret: { secretName: otel-collector-tls }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: platform-system }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: otel-collector, namespace: platform-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: otel-collector } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { platform.openai.internal/telemetry-client: "true" } }
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
    - from:
        - namespaceSelector: { matchLabels: { platform.openai.internal/monitoring: "true" } }
      ports:
        - { protocol: TCP, port: 8888 }
  egress:
    - to:
        - namespaceSelector: { matchLabels: { platform.openai.internal/telemetry-backend: "true" } }
      ports:
        - { protocol: TCP, port: 443 }
