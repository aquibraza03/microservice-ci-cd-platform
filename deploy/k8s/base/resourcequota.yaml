apiVersion: v1
kind: ResourceQuota
metadata:
  name: ${SERVICE_NAME}-quota
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: microservice-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  hard:
    requests.cpu: 4
    requests.memory: 4Gi
    limits.cpu: 8
    limits.memory: 8Gi
    pods: 20
    services: 10
    services.loadbalancers: 2
    configmaps: 50
    secrets: 50
    persistentvolumeclaims: 5
