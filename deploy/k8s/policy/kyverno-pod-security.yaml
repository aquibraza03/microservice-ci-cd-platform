apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-security-restricted
  annotations:
    policies.kyverno.io/title: Require Pod Security Standard (Restricted)
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Enforces the restricted Pod Security Standard across all workloads.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restricted-pss
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        podSecurity:
          level: restricted
          version: latest
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - falco
                - external-secrets
