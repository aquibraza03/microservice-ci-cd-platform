apiVersion: kustomize.config.k8s.io/v1
kind: Kustomization

resources:
  - base/deployment.yaml
  - base/service.yaml
  - base/hpa.yaml
  - base/pdb.yaml
  - base/networkpolicy.yaml
  - base/serviceaccount.yaml
  - base/limitrange.yaml
  - base/resourcequota.yaml
  - base/rbac.yaml

namespace: ${K8S_NAMESPACE}

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: microservice-platform
    includeSelectors: false
    includeTemplates: true

commonAnnotations:
  platform.io/deployment-model: kustomize
  platform.io/compliance-tier: ${COMPLIANCE_TIER}

configMapGenerator:
  - name: ${SERVICE_NAME}-config
    literals:
      - SERVICE_NAME=${SERVICE_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
    options:
      disableNameSuffixHash: true

# Secrets are no longer sourced from a plaintext .env.secret file.
# Secret material is managed by External Secrets Operator and fetched
# from the cloud provider secret manager at runtime. The ExternalSecret
# manifest lives in deploy/k8s/externalsecret.yaml.
