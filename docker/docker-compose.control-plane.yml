services:
  postgres:
    image: postgres:15-alpine
    container_name: control-plane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-control_plane}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - control-plane-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-control_plane}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [control-plane]

  control-plane:
    build:
      context: ../services/control-plane-api
    container_name: control-plane-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      AUTH_MODE: demo
      CONTROL_PLANE_STORAGE: postgres
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-control_plane}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    ports:
      - "${CONTROL_PLANE_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [control-plane]

networks:
  control-plane:
    name: control-plane-network

volumes:
  control-plane-postgres-data:
    name: control-plane-postgres-data
