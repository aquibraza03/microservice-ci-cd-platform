---
extends: default
rules:
  line-length:
    max: 200
    level: warning
  document-start:
    present: false
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  key-duplicates: error
  empty-values:
    forbid-in-block-mappings: false
  indentation:
    spaces: 2
    indent-sequences: consistent
