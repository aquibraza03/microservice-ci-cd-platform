apiVersion: v1
kind: Pod
metadata:
  labels:
    app: ci-agent
    app.kubernetes.io/name: ci-agent
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: microservice-platform
    app.kubernetes.io/managed-by: jenkins
spec:
  serviceAccountName: jenkins

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  automountServiceAccountToken: false

  containers:
    - name: runner
      image: ${CI_AGENT_IMAGE:-jenkins/inbound-agent:3384.v60d89463d9e0-2@sha256:3452f69764fffd742276590733ddc82c5643144cc78be76e0617f3f2f544425c}
      imagePullPolicy: IfNotPresent
      command:
        - cat
      tty: true
      resources:
        requests:
          cpu: "${CI_CPU_REQUEST:-500m}"
          memory: "${CI_MEMORY_REQUEST:-512Mi}"
        limits:
          cpu: "${CI_CPU_LIMIT:-2000m}"
          memory: "${CI_MEMORY_LIMIT:-2048Mi}"
      env:
        - name: DOCKER_BUILDKIT
          value: "1"
        - name: CI
          value: "true"
        - name: GRADLE_OPTS
          value: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
        - name: CLOUDSDK_CORE_DISABLE_PROMPTS
          value: "1"
        - name: AWS_EC2_METADATA_DISABLED
          value: "false"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    - name: docker
      image: ${DOCKER_IMAGE:-docker:27.5-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce}
      command:
        - dockerd-entrypoint.sh
      securityContext:
        privileged: true
        capabilities:
          add:
            - ALL
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "${DOCKER_CPU_LIMIT:-4000m}"
          memory: "${DOCKER_MEMORY_LIMIT:-4096Mi}"
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""

  imagePullSecrets:
    - name: ${IMAGE_PULL_SECRET:-jenkins-docker-registry}

  restartPolicy: Never
