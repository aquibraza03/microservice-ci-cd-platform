apiVersion: v1
kind: Pod
metadata:
  labels:
    app: ci-agent
spec:
  serviceAccountName: jenkins

  containers:
    - name: runner
      image: ${CI_AGENT_IMAGE:-jenkins/inbound-agent:latest}
      imagePullPolicy: IfNotPresent
      command:
        - cat
      tty: true
      resources:
        requests:
          cpu: "${CI_CPU_REQUEST:-500m}"
          memory: "${CI_MEMORY_REQUEST:-512Mi}"
        limits:
          cpu: "${CI_CPU_LIMIT:-2000m}"
          memory: "${CI_MEMORY_LIMIT:-2048Mi}"
      env:
        - name: DOCKER_BUILDKIT
          value: "1"
        - name: CI
          value: "true"
        - name: GRADLE_OPTS
          value: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

    - name: docker
      image: ${DOCKER_IMAGE:-docker:dind}
      command:
        - dockerd-entrypoint.sh
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "${DOCKER_CPU_LIMIT:-4000m}"
          memory: "${DOCKER_MEMORY_LIMIT:-4096Mi}"
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""

  imagePullSecrets:
    - name: ${IMAGE_PULL_SECRET:-jenkins-docker-registry}

  restartPolicy: Never
