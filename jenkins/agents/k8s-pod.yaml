apiVersion: v1
kind: Pod
metadata:
  labels:
    app: ci-agent
    app.kubernetes.io/name: ci-agent
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: microservice-platform
    app.kubernetes.io/managed-by: jenkins
spec:
  serviceAccountName: jenkins

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  automountServiceAccountToken: false

  containers:
    - name: runner
      image: ${CI_AGENT_IMAGE:-jenkins/inbound-agent:3207.vb_0791e53e9b_2}
      imagePullPolicy: IfNotPresent
      command:
        - cat
      tty: true
      resources:
        requests:
          cpu: "${CI_CPU_REQUEST:-500m}"
          memory: "${CI_MEMORY_REQUEST:-512Mi}"
        limits:
          cpu: "${CI_CPU_LIMIT:-2000m}"
          memory: "${CI_MEMORY_LIMIT:-2048Mi}"
      env:
        - name: DOCKER_BUILDKIT
          value: "1"
        - name: CI
          value: "true"
        - name: GRADLE_OPTS
          value: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

    - name: docker
      image: ${DOCKER_IMAGE:-docker:27.5-dind}
      command:
        - dockerd-entrypoint.sh
      securityContext:
        privileged: true
        capabilities:
          add:
            - ALL
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "${DOCKER_CPU_LIMIT:-4000m}"
          memory: "${DOCKER_MEMORY_LIMIT:-4096Mi}"
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""

  imagePullSecrets:
    - name: ${IMAGE_PULL_SECRET:-jenkins-docker-registry}

  restartPolicy: Never
