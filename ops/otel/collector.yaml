extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/client:
    client_auth:
      username: ${env:OTEL_BACKEND_USERNAME}
      password: ${env:OTEL_BACKEND_PASSWORD}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: ${env:OTEL_TLS_CERT_FILE}
          key_file: ${env:OTEL_TLS_KEY_FILE}
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: ${env:OTEL_TLS_CERT_FILE}
          key_file: ${env:OTEL_TLS_KEY_FILE}
  prometheus:
    config:
      global:
        scrape_interval: 30s
        scrape_timeout: 10s
      scrape_configs:
        - job_name: control-plane-api
          metrics_path: /api/v1/internal/metrics
          authorization:
            credentials: ${env:METRICS_TOKEN}
          static_configs:
            - targets: [control-plane-api:3000]
        - job_name: deployment-worker
          metrics_path: /metrics
          authorization:
            credentials: ${env:METRICS_TOKEN}
          static_configs:
            - targets: [deployment-worker:3002]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  attributes/redact:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.body, action: delete }
      - { key: db.statement, action: delete }
      - { key: process.command_args, action: delete }
      - { key: enduser.id, action: delete }
  batch:
    timeout: 5s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: platform
  otlphttp/traces:
    endpoint: ${env:TEMPO_OTLP_ENDPOINT}
    auth: { authenticator: basicauth/client }
    timeout: 3s
    sending_queue: { enabled: true, num_consumers: 4, queue_size: 2048 }
    retry_on_failure:
      {
        enabled: true,
        initial_interval: 1s,
        max_interval: 10s,
        max_elapsed_time: 60s,
      }
  otlphttp/logs:
    endpoint: ${env:LOKI_OTLP_ENDPOINT}
    auth: { authenticator: basicauth/client }
    timeout: 3s
    sending_queue: { enabled: true, num_consumers: 2, queue_size: 2048 }
    retry_on_failure:
      {
        enabled: true,
        initial_interval: 1s,
        max_interval: 10s,
        max_elapsed_time: 60s,
      }

service:
  extensions: [health_check, basicauth/client]
  telemetry:
    metrics: { address: 0.0.0.0:8888 }
  pipelines:
    metrics:
      {
        receivers: [prometheus, otlp],
        processors: [memory_limiter, attributes/redact, batch],
        exporters: [prometheus],
      }
    traces:
      {
        receivers: [otlp],
        processors: [memory_limiter, attributes/redact, batch],
        exporters: [otlphttp/traces],
      }
    logs:
      {
        receivers: [otlp],
        processors: [memory_limiter, attributes/redact, batch],
        exporters: [otlphttp/logs],
      }
